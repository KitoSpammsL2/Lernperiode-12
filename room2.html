<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH – Level 2</title>
    <link rel="stylesheet" href="room.css">
    <link rel="stylesheet" href="room-puzzles.css">
</head>
<body>

    <header class="hud">
        <h2>GLITCH // LEVEL 02</h2>

        <div class="stats">
            <span id="timer">05:00</span>
            <span id="progress">Rätsel: 0/3</span>
        </div>
    </header>

    <main class="game-room">

        <h1>SIMULATION 02</h1>
        <p class="subtitle">Der nächste Raum. Finde auch hier den Ausgang.</p>

        <div class="objects">
            <button class="object" data-object="konsole">
                <span class="symbol">▣</span>
                <span>KONSOLE</span>
            </button>

            <button class="object" data-object="tresor">
                <span class="symbol">▦</span>
                <span>TRESOR</span>
            </button>

            <button class="object" data-object="server">
                <span class="symbol">▥</span>
                <span>SERVER</span>
            </button>

            <button class="object" data-object="tuer">
                <span class="symbol">🚪</span>
                <span>AUSGANG</span>
            </button>
        </div>

        <div class="control-panel">
            <button id="glitchButton">GLITCH-MODUS</button>
        </div>

        <p id="message">System bereit. Untersuche den Raum.</p>
    </main>

    <script src="script.js"></script>
    <script src="puzzles.js"></script>
    <script src="door.js"></script>
    <script src="room.js"></script>
    <script src="room-puzzles.js"></script>
</body>
</html>
