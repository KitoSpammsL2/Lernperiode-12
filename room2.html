<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH – Level 2</title>
    <link rel="stylesheet" href="room.css">
    <link rel="stylesheet" href="room-puzzles.css">
    <link rel="stylesheet" href="faruk-design.css">
    <link rel="stylesheet" href="room2.css">
</head>
<body class="level-two">

    <header class="hud">
        <h2>GLITCH // LEVEL 02</h2>

        <div class="stats">
            <span class="timer-stat"><span class="stat-label">RESTZEIT</span><span id="timer" role="timer" aria-label="Verbleibende Zeit">05:00</span></span>
            <span class="progress-stat"><span class="stat-label">FORTSCHRITT</span><span id="progress" role="status">Rätsel: 0/3</span></span>
        </div>
    </header>

    <main class="game-room">

        <p class="sector-label">SEKTOR 02 / SIMULATION INSTABIL</p>
        <h1>DER VERLORENE SEKTOR</h1>
        <p class="subtitle">Drei Systeme. Ein Ausgang. Untersuche die Objekte und stelle den Zugang wieder her.</p>

        <div class="objects" role="group" aria-label="Interaktive Objekte">
            <button type="button" class="object" data-object="konsole">
                <span class="object-index" aria-hidden="true">01 / SYSTEM</span>
                <span class="symbol" aria-hidden="true">▣</span>
                <strong>KONSOLE</strong>
                <span class="object-description">Verschobene Daten</span>
                <span class="object-status">Untersuchen →</span>
            </button>

            <button type="button" class="object" data-object="tresor">
                <span class="object-index" aria-hidden="true">02 / SYSTEM</span>
                <span class="symbol" aria-hidden="true">▦</span>
                <strong>TRESOR</strong>
                <span class="object-description">Verstreute Datenfragmente</span>
                <span class="object-status">Untersuchen →</span>
            </button>

            <button type="button" class="object" data-object="server">
                <span class="object-index" aria-hidden="true">03 / SYSTEM</span>
                <span class="symbol" aria-hidden="true">▥</span>
                <strong>SERVER</strong>
                <span class="object-description">Sicherer Neustart</span>
                <span class="object-status">Untersuchen →</span>
            </button>

            <button type="button" class="object" data-object="tuer">
                <span class="object-index" aria-hidden="true">04 / EXIT</span>
                <span class="symbol" aria-hidden="true">🚪</span>
                <strong>AUSGANG</strong>
                <span class="object-description">Drei Rätsel öffnen die Tür</span>
                <span class="object-status">Gesperrt</span>
            </button>
        </div>

        <div class="control-panel">
            <button type="button" id="glitchButton" aria-pressed="false">GLITCH-MODUS</button>
            <p class="control-hint">Wechsle die Ansicht, um verborgene Hinweise zu sehen.</p>
        </div>

        <p id="message" role="status">System bereit. Untersuche den Raum.</p>
    </main>

    <script src="script.js"></script>
    <script src="puzzles.js"></script>
    <script src="door.js"></script>
    <script src="room.js"></script>
    <script src="room-puzzles.js"></script>
    <script src="faruk-room2.js"></script>
</body>
</html>
