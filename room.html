
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLITCH – Level 1</title>
    <link rel="stylesheet" href="room.css">
</head>
<body>

    <header class="hud">
        <h2>GLITCH // LEVEL 01</h2>

        <div class="stats">
            <span id="timer">05:00</span>
            <span id="progress">Rätsel: 0/3</span>
        </div>
    </header>

    <main class="game-room">

        <h1>SIMULATION 01</h1>
        <p class="subtitle">Finde die Hinweise und entkomme.</p>

        <div class="objects">
            
<button class="object" data-object="terminal">
    <span class="symbol">⌨</span>
    <span>TERMINAL</span>

    <!-- Nur im Glitch-Modus sichtbar -->
    <span class="glitch-hint">
        SYSTEM-FRAGMENT: 2048
    </span>
</button>


            <button class="object" data-object="schrank">
                <span class="symbol">▤</span>
                <span>SCHRANK</span>
            </button>

            <button class="object" data-object="tuer">
                <span class="symbol">🚪</span>
                <span>AUSGANG</span>
            </button>
        </div>

        <div class="control-panel">
            <button id="glitchButton">GLITCH-MODUS</button>
        </div>

        <p id="message">System bereit. Untersuche den Raum.</p>
    </main>

    <script src="room.js"></script>



<div id="puzzleModal" class="puzzle-modal" hidden>
    <div class="puzzle-box">
        <button id="closePuzzle" type="button">✕</button>
        <h2 id="puzzleTitle">Rätsel</h2>
        <p id="puzzleQuestion"></p>

        <input
            id="puzzleAnswer"
            type="text"
            placeholder="Lösung eingeben"
        >

        <button id="submitPuzzle" type="button">
            Lösung prüfen
        </button>

        <p id="puzzleFeedback"></p>
    </div>
</div>


<div id="endScreen" class="end-screen" hidden>
    <div class="end-box">
        <h1 id="endTitle"></h1>
        <p id="endMessage"></p>

        <button id="restartGame" type="button">
            ERNEUT SPIELEN
        </button>
    </div>
</div>


<script src="puzzles.js"></script>
<script src="door.js"></script>
<script src="room-integration.js"></script>
<script src="end-screen.js"></script>

</body>
</html>
